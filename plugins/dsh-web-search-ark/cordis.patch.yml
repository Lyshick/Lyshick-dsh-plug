# dsh bundle layer: mount the dsh-web-search-ark provider.
#
# The row config (defaults, overridable from the profile's cordis.patch.yml):
#   apiKeyEnv   comma-separated credential refs tried in order
#               (default ARK_API_KEY,HUOSHAN_API_KEY,ATEST_API_KEY)
#   baseURL     Ark Responses-API base; "/responses" is appended
#   model       model id that runs the search sub-task (must support web_search)
#   maxKeyword  max keyword searches one round may fan out to (Ark allows 1-50)
#   timeoutMs   per-search timeout
#
# Mounting does NOT select the provider. Activate with:
#   - id: web \n    config: { searchProvider: ark-official }
- insert:
    - id: web-search-ark
      name: dsh-web-search-ark
