# dsh bundle layer: mount the dsh-web-search-ark provider.
#
# The row config (defaults, overridable from the profile's cordis.patch.yml):
#   preset      backend defaults: ark (default) | qwen | custom
#   apiKeyEnv   comma-separated credential refs tried in order
#               (ark: ARK_API_KEY,HUOSHAN_API_KEY,ATEST_API_KEY
#                qwen: QIANWEN_AI_API_KEY,DASHSCOPE_API_KEY)
#   baseURL     Responses-API base; "/responses" is appended
#   model       model id that runs the search sub-task (must support web_search)
#   maxKeyword  max keyword searches one round may fan out to (Ark only, 1-50)
#   timeoutMs   per-search timeout
#   enrichTitles      fetch real page <title> for sources that only have a
#                     hostname (default false; adds latency per search)
#   enrichTitleLimit  how many sources to enrich, 1-10 (default 5)
#
# Mounting does NOT select the provider. Activate with:
#   - id: web \n    config: { searchProvider: ark-official }
- insert:
    - id: web-search-ark
      name: dsh-web-search-ark
